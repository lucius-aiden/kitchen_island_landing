<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservation Received · &quot;KITCHEN ISLAND&quot;</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap");

      :root {
        --canvas: #f5efe6;
        --ink: #171310;
        --muted: #625245;
        --rule: rgba(23, 19, 16, 0.12);
        --button: #14110f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(180, 135, 86, 0.16), transparent 24%),
          linear-gradient(180deg, #f7f2eb 0%, var(--canvas) 100%);
        color: var(--ink);
        font-family: "Manrope", sans-serif;
      }

      .card {
        width: min(620px, 100%);
        padding: 32px 0 0;
        border-top: 1px solid var(--rule);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.8rem, 8vw, 4.2rem);
        line-height: 0.95;
        font-weight: 600;
      }

      .copy {
        display: grid;
        gap: 14px;
        margin-top: 22px;
        color: var(--muted);
        line-height: 1.84;
      }

      .meta {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.88rem;
        letter-spacing: 0.04em;
      }

      a {
        display: inline-grid;
        place-items: center;
        min-height: 56px;
        padding: 0 22px;
        margin-top: 28px;
        background: var(--button);
        color: #f8f2eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Reservation Received</h1>
      <div class="copy">
        <p>Thank you.</p><p>Your request has been submitted for review.</p><p>If approved, we'll email  with your payment link.</p><p>Your place is only confirmed once payment has been received.</p>
      </div>
      <a href="/">Close</a>
      <p class="meta">Reference Preview</p>
    </main>
  </body>
</html>
